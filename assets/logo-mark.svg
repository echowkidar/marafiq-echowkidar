<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SONU">
  <!-- SONU mark: an "S" folded from three ribbons (blue / amber / teal), each laid over the previous -->
  <defs>
    <linearGradient id="sB" x1="47" y1="12" x2="17" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EC5FF"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sA" x1="20" y1="28" x2="45" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC531"/><stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="sT" x1="47" y1="36" x2="15" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34E0C4"/><stop offset="1" stop-color="#0A8F84"/>
    </linearGradient>
    <filter id="fold" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <feDropShadow dx="-0.6" dy="1.1" stdDeviation="1.1" flood-color="#0b1b33" flood-opacity=".35"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-width="10">
