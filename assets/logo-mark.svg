    <path d="M21.4 29 C28.6 31.6 35.8 33.8 43 36.4" stroke="url(#sA)" filter="url(#fold)"/>
    <path d="M39.6 34.8 C46 37.4 48.8 41.4 46.6 46.6 C42.8 55.4 23.4 55.6 16.4 46.8" stroke="url(#sT)" filter="url(#fold)"/>
